<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành Tạo bố cục cơ bản</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="main">
        <!-- Vùng đầu trang (Logo & Banner) -->
        <div id="head">
            <h2>HEAD - Logo & Banner</h2>
        </div>

        <!-- Vùng liên kết đầu trang -->
        <div id="head-link">
            Home | Students | Course | About | Contact
        </div>

        <!-- Vùng cột trái -->
        <div id="left">
            <h3>Left Menu</h3>
            <ul>
                <li>Liên kết 1</li>
                <li>Liên kết 2</li>
                <li>Liên kết 3</li>
            </ul>
        </div>

        <!-- Vùng nội dung chính -->
        <div id="content">
            <h3>Content</h3>
            <p>Hot news, Photo Slide, News 1, News 2...</p>
        </div>

        <!-- Vùng cột phải -->
        <div id="right">
            <h3>Right Section</h3>
            <p>Lịch, biểu đồ, bản đồ...</p>
        </div>

        <!-- Vùng chân trang -->
        <div id="footer">
            <p>Footer - Thông tin chủ sở hữu & bản quyền</p>
        </div>
    </div>

</body>
</html>
