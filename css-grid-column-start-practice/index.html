<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS grid-column-start Property</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Thực hành: Thuộc tính grid-column-start</h1>

    <div class="example-container">
        <h2>1. Giá trị column-line (grid-column-start: 2)</h2>
        <div class="grid-container">
            <div class="grid-item item-column-line">Bắt đầu từ đường cột 2</div>
            <div class="grid-item">Item 2</div>
            <div class="grid-item">Item 3</div>
        </div>
    </div>

    <div class="example-container">
        <h2>2. Giá trị span n (grid-column-start: span 2)</h2>
        <div class="grid-container">
            <div class="grid-item item-span">Kéo dài 2 cột (span 2)</div>
            <div class="grid-item">Item 2</div>
            <div class="grid-item">Item 3</div>
        </div>
    </div>

    <div class="example-container">
        <h2>3. Giá trị auto (grid-column-start: auto)</h2>
        <div class="grid-container">
            <div class="grid-item item-auto">Tự động (Auto)</div>
            <div class="grid-item">Item 2</div>
            <div class="grid-item">Item 3</div>
            <div class="grid-item">Item 4</div>
        </div>
    </div>

</body>
</html>
