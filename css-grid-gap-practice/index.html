<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS grid-gap Property</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Thực hành: Thuộc tính grid-gap</h1>

    <div class="example-container">
        <h2>1. grid-gap: 20px 10px (Hàng 20px, Cột 10px)</h2>
        <div class="grid-container grid-gap-custom">
            <div class="grid-item">Item 1</div>
            <div class="grid-item">Item 2</div>
            <div class="grid-item">Item 3</div>
            <div class="grid-item">Item 4</div>
            <div class="grid-item">Item 5</div>
            <div class="grid-item">Item 6</div>
        </div>
    </div>

    <div class="example-container">
        <h2>2. grid-gap: 15px (Hàng & Cột đều là 15px)</h2>
        <div class="grid-container grid-gap-equal">
            <div class="grid-item">Item 1</div>
            <div class="grid-item">Item 2</div>
            <div class="grid-item">Item 3</div>
            <div class="grid-item">Item 4</div>
            <div class="grid-item">Item 5</div>
            <div class="grid-item">Item 6</div>
        </div>
    </div>

</body>
</html>
