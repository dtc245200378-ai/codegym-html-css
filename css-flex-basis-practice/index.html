<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS flex-basis Property</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Thực hành: Thuộc tính flex-basis</h1>

    <div class="example-container">
        <h2>1. Giá trị Length (flex-basis: 200px)</h2>
        <div class="flex-container">
            <div class="flex-item item-length">200px</div>
            <div class="flex-item">Item 2</div>
            <div class="flex-item">Item 3</div>
        </div>
    </div>

    <div class="example-container">
        <h2>2. Giá trị Auto (flex-basis: auto)</h2>
        <div class="flex-container">
            <div class="flex-item item-auto">Nội dung tự co giãn (Auto)</div>
            <div class="flex-item">Item 2</div>
            <div class="flex-item">Item 3</div>
        </div>
    </div>

    <div class="example-container">
        <h2>3. Giá trị Percentage (flex-basis: 40%)</h2>
        <div class="flex-container">
            <div class="flex-item item-percent">Chiếm 40% độ rộng</div>
            <div class="flex-item">Item 2</div>
            <div class="flex-item">Item 3</div>
        </div>
    </div>

</body>
</html>
