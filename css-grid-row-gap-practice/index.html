<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS grid-row-gap Property</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Thực hành: Thuộc tính grid-row-gap</h1>

    <div class="example-container">
        <h2>1. Giá trị Length (grid-row-gap: 20px)</h2>
        <div class="grid-container grid-length">
            <div class="grid-item">Item 1</div>
            <div class="grid-item">Item 2</div>
            <div class="grid-item">Item 3</div>
            <div class="grid-item">Item 4</div>
            <div class="grid-item">Item 5</div>
            <div class="grid-item">Item 6</div>
        </div>
    </div>

    <div class="example-container">
        <h2>2. Giá trị Percentage (grid-row-gap: 5%)</h2>
        <div class="grid-container grid-percentage">
            <div class="grid-item">Item 1</div>
            <div class="grid-item">Item 2</div>
            <div class="grid-item">Item 3</div>
            <div class="grid-item">Item 4</div>
            <div class="grid-item">Item 5</div>
            <div class="grid-item">Item 6</div>
        </div>
    </div>

</body>
</html>
