<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS grid-template-columns Property</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Thực hành: Thuộc tính grid-template-columns</h1>

    <div class="example-container">
        <h2>Ví dụ 1: Cột kích thước (150px - Auto - 20%)</h2>
        <div class="grid-1">
            <div class="grid-item">150px</div>
            <div class="grid-item">Auto</div>
            <div class="grid-item">20%</div>
            <div class="grid-item">150px</div>
            <div class="grid-item">Auto</div>
            <div class="grid-item">20%</div>
        </div>
    </div>

    <div class="example-container">
        <h2>Ví dụ 2: Cột min-content - max-content - 1fr</h2>
        <div class="grid-2">
            <div class="grid-item">Min</div>
            <div class="grid-item">Max Content Text Example</div>
            <div class="grid-item">1fr (Phần còn lại)</div>
        </div>
    </div>

</body>
</html>
