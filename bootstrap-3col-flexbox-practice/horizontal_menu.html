<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành Tạo Menu Ngang Dropdown</title>
    <style>
        /* Cấu hình phông chữ và reset margin/padding */
        * {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        /* Khung định dạng thanh menu chính */
        #menu {
            background-color: #333;
            height: 40px;
        }

        #menu ul {
            list-style-type: none;
        }

        /* Định dạng các mục menu cấp 1 nằm ngang */
        #menu > ul > li {
            float: left;
            position: relative;
        }

        /* Định dạng các thẻ liên kết a */
        #menu a {
            display: block;
            width: 120px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            color: white;
            text-decoration: none;
            background-color: #333;
        }

        /* Đổi màu nền sang đỏ khi rê chuột qua liên kết */
        #menu a:hover {
            background-color: red;
        }

        /* Định dạng và ẩn menu con (dropdown) */
        #menu ul ul {
            position: absolute;
            top: 40px;
            left: 0;
            visibility: hidden;
        }

        #menu ul ul li {
            float: none;
        }

        /* Hiển thị menu con khi di chuột vào mục menu cha */
        #menu li:hover > ul {
            visibility: visible;
        }
    </style>
</head>
<body>

    <div id="menu">
        <ul>
            <li><a href="#">Trang chủ</a></li>
            <li>
                <a href="#">Sản phẩm</a>
                <ul>
                    <li><a href="#">Điện thoại</a></li>
                    <li><a href="#">Laptop</a></li>
                    <li><a href="#">Máy tính</a></li>
                </ul>
            </li>
            <li>
                <a href="#">Dịch vụ</a>
                <ul>
                    <li><a href="#">Bảo hành</a></li>
                    <li><a href="#">Sửa chữa</a></li>
                </ul>
            </li>
            <li><a href="#">Liên hệ</a></li>
        </ul>
    </div>

</body>
</html>
