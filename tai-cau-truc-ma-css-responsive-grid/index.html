<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Grid Layout</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>Responsive Grid System</h1>
        </div>
    </header>

    <main class="container">
        <div class="row">
            <div class="col-4">
                <div class="card">
                    <h2>Cột 1</h2>
                    <p>Mã CSS đã được tái cấu trúc sang SASS theo kiến trúc Modular hiện đại.</p>
                </div>
            </div>
            <div class="col-4">
                <div class="card">
                    <h2>Cột 2</h2>
                    <p>Tối ưu hóa các thuộc tính responsive và tái sử dụng biến cùng mixins.</p>
                </div>
            </div>
            <div class="col-4">
                <div class="card">
                    <h2>Cột 3</h2>
                    <p>Giao diện tự động co giãn tương thích tốt trên mọi kích thước màn hình.</p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
